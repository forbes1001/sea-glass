mutation CreateArtistData($data: Artist_Data!) @auth(level: USER) {
  artist_insert(data: $data)
}

mutation UpdateArtistData($key: Artist_Key!, $data: Artist_Data!) @auth(level: USER) {
  artist_update(key: $key, data: $data)
}

mutation DeleteArtistData($key: Artist_Key!) @auth(level: USER) {
  artist_delete(key: $key)
}

query GetArtist($key: Artist_Key!) @auth(level: USER) {
  artist(key: $key) {
    id
    name
    bio
    email
  }
}

query ListArtists @auth(level: PUBLIC, insecureReason: "Artists are public profiles") {
  artists {
    id
    name
  }
}

